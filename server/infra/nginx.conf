# Devant PHP-FPM. Le TLS est terminé par l'Apache de la machine (comme pour Rondo),
# qui transmet ici en clair sur la boucle locale.
server {
    listen 8000;
    server_name _;

    # Un tournoi pèse quelques dizaines de Ko ; l'API refuse au-delà de 1 Mo.
    client_max_body_size 2m;

    location / {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
}
