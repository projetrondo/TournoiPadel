# Hôte virtuel Apache de la machine (même montage que Rondo) : termine le TLS
# et transmet à nginx sur la boucle locale. Certificat : certbot --apache -d api.eagle-padel.fr
<VirtualHost *:443>
    ServerName api.eagle-padel.fr

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8120/
    ProxyPassReverse / http://127.0.0.1:8120/
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    # Lignes ajoutées par certbot :
    # SSLCertificateFile /etc/letsencrypt/live/api.eagle-padel.fr/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/api.eagle-padel.fr/privkey.pem
</VirtualHost>
