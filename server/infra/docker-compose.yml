# API EAGLE, sur la machine partagée qui porte déjà Rondo.
#
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
#
# Mêmes règles que Rondo : un seul port publié, sur la boucle locale (l'Apache de l'hôte
# est le seul chemin d'entrée et termine le TLS), et des limites de mémoire partout.
# Les secrets vivent dans infra/.env sur le serveur, hors dépôt (modèle : .env.example).

name: eagle

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:${EAGLE_PORT:-8120}:8000'
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 64M

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET}
      TOKEN_SECRET: ${TOKEN_SECRET}
      DATABASE_URL: postgresql://eagle:${POSTGRES_PASSWORD}@postgres:5432/eagle?serverVersion=16&charset=utf8
      PUBLIC_URL: ${PUBLIC_URL}
      APP_CALLBACK_URL: eagle://auth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APPLE_AUDIENCE: com.projetrondo.padelbuddy
      # Apache puis nginx sont devant PHP : sans cette confiance, l'adresse IP vue par
      # l'API (limite des tentatives de connexion) serait celle du proxy.
      SYMFONY_TRUSTED_PROXIES: private_ranges
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eagle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eagle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eagle']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
