# Compilation signée et envoi sur TestFlight, sans Mac (lancement manuel depuis l'onglet Actions).
# Prérequis (voir docs/PUBLICATION.md) : compte Apple Developer, app créée dans App Store Connect,
# clé d'API App Store Connect (rôle Admin) et secrets GitHub :
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      cloudkit:
        description: "Activer le partage CloudKit (seulement après avoir créé le conteneur iCloud, voir docs/PARTAGE.md)"
        type: boolean
        default: false

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name manquant. Voir docs/PUBLICATION.md, étape « Secrets GitHub »."
              exit 1
            fi
          done

      - name: Préparer la clé d'API
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Générer le projet
        run: |
          brew install xcodegen
          xcodegen generate

      # Archive sans signature : la signature automatique de l'archivage exigerait un profil de
      # développement, donc un iPhone enregistré sur le compte. La signature de distribution
      # (la seule utile pour TestFlight et l'App Store) est faite à l'étape suivante.
      - name: Archiver
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PadelBuddy.xcodeproj \
            -scheme PadelBuddy \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/PadelBuddy.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CLOUDKIT_ENABLED="${{ inputs.cloudkit && 'YES' || 'NO' }}" \
            CODE_SIGN_ENTITLEMENTS="${{ inputs.cloudkit && 'Config/PadelBuddy.entitlements' || '' }}" \
            2>&1 | tee archive.log

      - name: Signer pour la distribution et envoyer sur App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PadelBuddy.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tee export.log

      # Les erreurs sont republiées en annotations, lisibles sans télécharger les journaux.
      - name: Résumer les erreurs
        if: failure()
        run: |
          for f in archive.log export.log; do
            [ -f "$f" ] || continue
            grep -E "error:|error -|Error Domain|requires a provisioning profile|No profiles|No signing certificate|No Accounts|doesn't include|not found|Provisioning profile" "$f" \
              | grep -v "^note:" | sed 's/[[:space:]]\+/ /g' | sort -u | head -15 \
              | while IFS= read -r line; do echo "::error title=$f::${line:0:900}"; done
          done
          # Toujours utile : les dernières lignes de l'envoi.
          if [ -f export.log ]; then
            tail -n 12 export.log | sed 's/[[:space:]]\+/ /g' | grep -v '^ *$' \
              | while IFS= read -r line; do echo "::warning title=fin de export.log::${line:0:900}"; done
          fi

      - name: Nettoyer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
