# Compilation signée et envoi sur TestFlight, sans Mac (lancement manuel depuis l'onglet Actions).
# Prérequis (voir docs/PUBLICATION.md) : compte Apple Developer, app créée dans App Store Connect,
# clé d'API App Store Connect (rôle Admin) et secrets GitHub :
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      cloudkit:
        description: "Activer le partage CloudKit (seulement après avoir créé le conteneur iCloud, voir docs/PARTAGE.md)"
        type: boolean
        default: false
      api_url:
        description: "Adresse de l'API EAGLE pour les comptes (ex. https://api.eagle-padel.fr). Vide = pas de compte. Voir docs/COMPTES.md"
        type: string
        default: ""

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Apple exige le SDK iOS 26 (Xcode 26) ou plus récent pour tout envoi sur App Store Connect.
      - name: Choisir Xcode 26 ou plus récent
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | grep -v -i beta | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Aucun Xcode 26+ sur cette machine : $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Vérifier les secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name manquant. Voir docs/PUBLICATION.md, étape « Secrets GitHub »."
              exit 1
            fi
          done

      - name: Préparer la clé d'API
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"

      # Droits de l'app selon les options : partage CloudKit, « Se connecter avec Apple ».
      - name: Préparer les droits
        env:
          API_URL: ${{ inputs.api_url }}
          CLOUDKIT: ${{ inputs.cloudkit }}
        run: |
          ENT="$RUNNER_TEMP/EAGLE.entitlements"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            if [ "$CLOUDKIT" = "true" ]; then
              echo '<key>com.apple.developer.icloud-container-identifiers</key><array><string>iCloud.com.projetrondo.padelbuddy</string></array>'
              echo '<key>com.apple.developer.icloud-services</key><array><string>CloudKit</string></array>'
            fi
            if [ -n "$API_URL" ]; then
              case "$API_URL" in https://*) ;; *) echo "::error::api_url doit commencer par https://"; exit 1 ;; esac
              echo '<key>com.apple.developer.applesignin</key><array><string>Default</string></array>'
            fi
            echo '</dict></plist>'
          } > "$ENT"
          plutil -lint "$ENT"
          if [ "$CLOUDKIT" = "true" ] || [ -n "$API_URL" ]; then echo "ENTITLEMENTS=$ENT" >> "$GITHUB_ENV"; fi

      - name: Générer le projet
        run: |
          brew install xcodegen
          xcodegen generate

      # Archive sans signature : la signature automatique de l'archivage exigerait un profil de
      # développement, donc un iPhone enregistré sur le compte. La signature de distribution
      # (la seule utile pour TestFlight et l'App Store) est faite à l'étape suivante.
      - name: Archiver
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PadelBuddy.xcodeproj \
            -scheme PadelBuddy \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/PadelBuddy.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CLOUDKIT_ENABLED="${{ inputs.cloudkit && 'YES' || 'NO' }}" \
            EAGLE_API_URL="$API_URL" \
            2>&1 | tee archive.log
          # L'archive n'est pas signée : les droits sont posés par une signature provisoire,
          # que l'export remplace par la signature de distribution en les conservant.
          if [ -n "${ENTITLEMENTS:-}" ]; then
            codesign --force --sign - --timestamp=none --entitlements "$ENTITLEMENTS" \
              "$RUNNER_TEMP/PadelBuddy.xcarchive/Products/Applications/PadelBuddy.app"
            codesign -d --entitlements - "$RUNNER_TEMP/PadelBuddy.xcarchive/Products/Applications/PadelBuddy.app"
          fi

      - name: Signer pour la distribution et envoyer sur App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PadelBuddy.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tee export.log

      # Les erreurs sont republiées en annotations, lisibles sans télécharger les journaux.
      - name: Résumer les erreurs
        if: failure()
        run: |
          for f in archive.log export.log; do
            [ -f "$f" ] || continue
            grep -E "error:|error -|Error Domain|requires a provisioning profile|No profiles|No signing certificate|No Accounts|doesn't include|not found|Provisioning profile" "$f" \
              | grep -v "^note:" | sed 's/[[:space:]]\+/ /g' | sort -u | head -15 \
              | while IFS= read -r line; do echo "::error title=$f::${line:0:900}"; done
          done
          # Toujours utile : les dernières lignes de l'envoi.
          if [ -f export.log ]; then
            tail -n 12 export.log | sed 's/[[:space:]]\+/ /g' | grep -v '^ *$' \
              | while IFS= read -r line; do echo "::warning title=fin de export.log::${line:0:900}"; done
          fi

      - name: Nettoyer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
