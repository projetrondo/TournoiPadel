name: CI

on:
  push:
    branches-ignore: [ci-results]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Moteur PadelCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Tests du moteur
        run: swift test --package-path Packages/PadelCore 2>&1 | tee core-tests.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-tests
          path: core-tests.log

  api:
    name: API EAGLE (PHP 8.4, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eagle
          POSTGRES_PASSWORD: eagle
          POSTGRES_DB: eagle
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eagle" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Base de test et migrations
        run: |
          APP_ENV=test php bin/console doctrine:database:create --if-not-exists
          APP_ENV=test php bin/console doctrine:migrations:migrate --no-interaction
          APP_ENV=test php bin/console doctrine:schema:validate
      - name: Tests de l'API
        run: vendor/bin/phpunit 2>&1 | tee ../api-tests.log
        shell: bash
      - name: Image Docker de production
        run: docker build -f infra/Dockerfile --target prod -t eagle-api .

  ios:
    name: Application iOS (simulateur)
    runs-on: macos-26
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Apple exige le SDK iOS 26 (Xcode 26) ou plus récent pour tout envoi sur App Store Connect.
      - name: Choisir Xcode 26 ou plus récent
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | grep -v -i beta | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Aucun Xcode 26+ sur cette machine : $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version | tee -a report.md

      - name: Choisir un simulateur iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID" | tee -a report.md

      - name: Compiler et tester
        run: |
          set -o pipefail
          xcodebuild test \
            -project PadelBuddy.xcodeproj \
            -scheme PadelBuddy \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Captures d'écran
        if: success()
        run: |
          mkdir -p screenshots
          UDID=${{ steps.sim.outputs.udid }}
          BUNDLE=com.projetrondo.padelbuddy
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/PadelBuddy.app
          shot() {
            local name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" -ui-testing -demo-data "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shot 1-accueil
          shot 2-matchs -demo-open inProgress -demo-tab matches
          shot 3-saisie-score -demo-open inProgress -demo-score
          shot 4-classement -demo-open inProgress -demo-tab standings
          shot 5-resultats -demo-open finished -demo-tab results
          shot 6-profil -demo-open inProgress -demo-tab standings -demo-player
          shot 7-profil-termine -demo-open finished -demo-tab standings -demo-player
          shot 10-session-classement -demo-session
          shot 11-session-joueurs -demo-session -demo-session-tab players
          shot 12-compte-connexion -demo-open-account
          shot 13-compte-connecte -demo-account -demo-open-account
          shot 14-accueil-en -demo-language en
          shot 15-classement-en -demo-language en -demo-open inProgress -demo-tab standings
          shot 16-session-en -demo-language en -demo-session
          shot 17-saisie-en -demo-language en -demo-open inProgress -demo-score
          xcrun simctl ui "$UDID" content_size accessibility-extra-large
          shot 8-classement-grand-texte -demo-open inProgress -demo-tab standings
          shot 9-accueil-grand-texte
          xcrun simctl ui "$UDID" content_size large

      # Textes à traduire, extraits du code par Xcode (fichier XLIFF publié avec le rapport).
      - name: Exporter les textes à traduire
        if: success()
        continue-on-error: true
        run: |
          xcodebuild -exportLocalizations \
            -project PadelBuddy.xcodeproj \
            -localizationPath l10n-export \
            -exportLanguage en \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO > l10n-export.log 2>&1 || tail -30 l10n-export.log
          mkdir -p l10n
          find l10n-export -name "*.xliff" -exec cp {} l10n/ \;
          ls -la l10n

      - name: Rapport
        if: always()
        run: |
          {
            echo "## Erreurs et avertissements"
            grep -E "error:|warning:" xcodebuild.log | grep -v "^ld: warning" | sort -u | head -150 || true
            echo
            echo "## Tests"
            grep -E "✔|✘|Test Suite|Executed|passed|failed" xcodebuild.log | tail -80 || true
            echo
            echo "## Fin du journal"
            tail -60 xcodebuild.log || true
          } >> report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            report.md
            xcodebuild.log
            screenshots/

      # Copie du rapport sur la branche `ci-results`, lisible sans accès à l'API GitHub.
      - name: Publier le rapport sur la branche ci-results
        if: always() && github.event_name == 'push'
        run: |
          RESULT_DIR=$(mktemp -d)
          cp report.md "$RESULT_DIR/"
          cp -R screenshots "$RESULT_DIR/" 2>/dev/null || true
          cp -R l10n "$RESULT_DIR/" 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > "$RESULT_DIR/STATUS"
          cd "$RESULT_DIR"
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Rapport CI pour ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
