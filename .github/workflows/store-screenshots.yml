# Captures pour la fiche App Store : iPhone 6,9 pouces (format exigé par Apple), français et
# anglais, app dans son état publié (sans partage ni compte). Résultat sur la branche
# `store-screenshots` (dossiers fr/ et en/), prêt à déposer dans App Store Connect.
name: Captures App Store

on:
  workflow_dispatch:
  push:
    branches: [publication]

jobs:
  screenshots:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode 26 ou plus récent
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | grep -v -i beta | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Générer le projet
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Choisir un iPhone 6,9 pouces (Pro Max)
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone") and "Pro Max" in d["name"]))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Compiler
        run: |
          set -o pipefail
          xcodebuild build -project PadelBuddy.xcodeproj -scheme PadelBuddy \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20

      - name: Captures
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          BUNDLE=com.projetrondo.padelbuddy
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Barre d'état propre, comme sur les fiches Apple.
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/PadelBuddy.app
          for lang in fr en; do
            mkdir -p store/$lang
            shot() {
              local name=$1; shift
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BUNDLE" -ui-testing -demo-data -store -demo-language "$lang" "$@"
              sleep 7
              xcrun simctl io "$UDID" screenshot "store/$lang/$name.png"
            }
            shot 1-classement -demo-open inProgress -demo-tab standings
            shot 2-saisie -demo-open inProgress -demo-score
            shot 3-podium -demo-open finished -demo-tab results
            shot 4-session -demo-session
            shot 5-profil -demo-open finished -demo-tab standings -demo-player
            shot 6-accueil
          done
          sips -g pixelWidth -g pixelHeight store/fr/1-classement.png

      - name: Publier sur la branche store-screenshots
        run: |
          DIR=$(mktemp -d)
          cp -R store/* "$DIR/"
          echo "${{ github.sha }}" > "$DIR/SOURCE"
          cd "$DIR"
          git init -q -b store-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures App Store pour ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store-screenshots
