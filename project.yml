# Définition du projet Xcode, lue par XcodeGen : `xcodegen generate` crée PadelBuddy.xcodeproj.
# Le .xcodeproj n'est pas versionné : ce fichier est la seule source de vérité.
name: PadelBuddy
options:
  bundleIdPrefix: com.projetrondo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Partage entre iPhone (CloudKit). Passer à YES une fois le compte Apple Developer actif
    # et le conteneur créé (voir docs/PARTAGE.md).
    CLOUDKIT_ENABLED: "NO"
    CLOUDKIT_CONTAINER: iCloud.com.projetrondo.padelbuddy
    # Comptes et sauvegarde en ligne : adresse de l'API (dossier server/). Vide = désactivé.
    # Renseignée au moment de la compilation TestFlight (voir docs/COMPTES.md).
    EAGLE_API_URL: ""

packages:
  PadelCore:
    path: Packages/PadelCore

targets:
  PadelBuddy:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PadelCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: EAGLE
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Identité EAGLE : interface toujours sombre (noir carbone).
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        PBCloudKitEnabled: $(CLOUDKIT_ENABLED)
        PBCloudKitContainer: $(CLOUDKIT_CONTAINER)
        EagleAPIURL: $(EAGLE_API_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.projetrondo.padelbuddy.invite
            CFBundleURLSchemes:
              - padelbuddy
    entitlements:
      path: Config/PadelBuddy.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - $(CLOUDKIT_CONTAINER)
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_NAME: PadelBuddy
        PRODUCT_BUNDLE_IDENTIFIER: com.projetrondo.padelbuddy
        # iPhone uniquement (XcodeGen ajoute l'iPad par défaut au niveau de la cible).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  PadelBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: PadelBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.projetrondo.padelbuddy.tests

schemes:
  PadelBuddy:
    build:
      targets:
        PadelBuddy: all
        PadelBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PadelBuddyTests
