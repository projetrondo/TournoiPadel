# Définition du projet Xcode, lue par XcodeGen : `xcodegen generate` crée PadelBuddy.xcodeproj.
# Le .xcodeproj n'est pas versionné : ce fichier est la seule source de vérité.
name: PadelBuddy
options:
  bundleIdPrefix: com.projetrondo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  PadelCore:
    path: Packages/PadelCore

targets:
  PadelBuddy:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PadelCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Padel Buddy
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: PadelBuddy
        PRODUCT_BUNDLE_IDENTIFIER: com.projetrondo.padelbuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  PadelBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: PadelBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.projetrondo.padelbuddy.tests

schemes:
  PadelBuddy:
    build:
      targets:
        PadelBuddy: all
        PadelBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PadelBuddyTests
